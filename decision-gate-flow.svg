<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Decision-gate flow diagram</title>
<desc>A new task arrives and splits into two paths. Without a decision check, the agent writes code directly and a conflict with an earlier decision slips through silently. With a decision check, the agent reads the decision log first and the conflict is caught before any code is written.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Start box -->
<rect x="230" y="20" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">New task arrives</text>

<!-- Branch arrows: start -> row 2 -->
<path d="M340 64 L340 84 L160 84 L160 100" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 64 L340 84 L520 84 L520 100" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 2 left: no check -->
<rect x="50" y="100" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="160" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">No check</text>
<text x="160" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">writes code directly</text>

<!-- Row 2 right: checks decision log -->
<rect x="410" y="100" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="520" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Checks decisions log</text>
<text x="520" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">before writing any code</text>

<!-- Arrows: row 2 -> row 3 -->
<line x1="160" y1="156" x2="160" y2="190" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="156" x2="520" y2="190" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 3 left: silent conflict (coral) -->
<rect x="50" y="190" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="160" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Silent conflict</text>
<text x="160" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">found after it breaks</text>

<!-- Row 3 right: caught early (teal) -->
<rect x="410" y="190" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Conflict caught early</text>
<text x="520" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">flagged before any code</text>

<!-- Caption -->
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Same task, two otherwise-identical agents — one checks the decision log first</text>
</svg>
