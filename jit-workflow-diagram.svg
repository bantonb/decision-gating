<svg width="100%" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Standard agent workflow vs. just-in-time decision-gated workflow</title>
<desc>Two vertical flows. Left: a standard agent workflow where a task arrives and the agent implements it directly with no awareness of prior decisions. Right: the decision-gated workflow, where a task arrives, the agent checks a cheap decision index, follows a pointer to a full decision record only if relevant, optionally follows a Related or Depends-on link one hop further, and only then implements, flagging any conflict before writing code.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Column headers -->
<text x="150" y="24" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Standard workflow</text>
<text x="530" y="24" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Just-in-time, decision-gated workflow</text>

<!-- LEFT COLUMN: Standard workflow -->
<rect x="40" y="50" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Task arrives</text>

<line x1="150" y1="94" x2="150" y2="128" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="40" y="128" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Agent implements directly</text>

<line x1="150" y1="172" x2="150" y2="206" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="40" y="206" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="150" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">No awareness of prior decisions</text>
<text x="150" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#993C1D">conflicts surface later, if at all</text>

<!-- RIGHT COLUMN: JIT gated workflow -->
<rect x="420" y="50" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Task arrives</text>

<line x1="530" y1="94" x2="530" y2="118" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="420" y="118" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="134" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Check the cheap index</text>
<text x="530" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">one line per decision</text>

<line x1="530" y1="162" x2="530" y2="186" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="420" y="186" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="202" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Relevant? Read full record</text>
<text x="530" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">only if the task overlaps it</text>

<line x1="530" y1="230" x2="530" y2="254" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="420" y="254" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Follow Related / Depends-on</text>
<text x="530" y="286" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">one hop, only if still relevant</text>

<line x1="530" y1="298" x2="530" y2="322" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="420" y="322" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Implement, conflict-aware</text>
<text x="530" y="358" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">flagged before code is written</text>

<!-- Caption -->
<text x="350" y="405" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Nothing is pre-loaded on the right — each step only happens if the step before it judges it relevant</text>
</svg>
